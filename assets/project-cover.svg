<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Multilingual Document Intelligence interface preview</title>
  <desc id="desc">A question in English connected to cited evidence from Arabic, Turkish, and English documents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020617" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1400" height="720" rx="34" fill="url(#bg)"/>
  <circle cx="1180" cy="70" r="280" fill="#38bdf8" opacity=".08"/>
  <circle cx="170" cy="690" r="330" fill="#8b5cf6" opacity=".12"/>

  <g transform="translate(84 70)">
    <text x="0" y="24" fill="#a5b4fc" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" letter-spacing="4">DOCUMENT INTELLIGENCE</text>
    <text x="0" y="83" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="48" font-weight="760">Ask your documents.</text>
    <text x="0" y="132" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="26">See the evidence.</text>

    <g transform="translate(0 177)" filter="url(#shadow)">
      <rect width="1232" height="408" rx="28" fill="#ffffff" opacity=".98"/>
      <rect x="0" y="0" width="1232" height="58" rx="28" fill="#f8fafc"/>
      <circle cx="30" cy="29" r="6" fill="#fb7185"/>
      <circle cx="50" cy="29" r="6" fill="#fbbf24"/>
      <circle cx="70" cy="29" r="6" fill="#34d399"/>
      <text x="100" y="36" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="15">6 documents · 3 languages · citation-first</text>

      <g transform="translate(38 88)">
        <rect width="726" height="72" rx="18" fill="#eef2ff"/>
        <text x="24" y="30" fill="#6366f1" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">QUESTION</text>
        <text x="24" y="54" fill="#172033" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="600">When should the vibration warning be escalated?</text>

        <rect y="178" width="726" height="162" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
        <rect x="0" y="178" width="6" height="162" rx="3" fill="url(#accent)"/>
        <text x="24" y="210" fill="#0f766e" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">GROUNDED ANSWER</text>
        <text x="24" y="247" fill="#172033" font-family="Inter,Segoe UI,sans-serif" font-size="18">Escalate when vibration remains above 7.1 mm/s RMS</text>
        <text x="24" y="276" fill="#172033" font-family="Inter,Segoe UI,sans-serif" font-size="18">for at least 10 consecutive seconds.</text>
        <rect x="24" y="298" width="45" height="26" rx="13" fill="#ede9fe"/>
        <text x="37" y="316" fill="#6d28d9" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">[1]</text>
        <text x="82" y="316" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13">98% retrieval confidence</text>
      </g>

      <g transform="translate(802 88)">
        <text x="0" y="17" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2">EVIDENCE</text>
        <rect y="36" width="392" height="130" rx="18" fill="#172033"/>
        <rect x="18" y="54" width="38" height="24" rx="12" fill="#4338ca"/>
        <text x="27" y="71" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">EN</text>
        <text x="18" y="103" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="650">[1] maintenance_en.md</text>
        <text x="18" y="130" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">Threshold · duration · escalation rule</text>

        <g transform="translate(0 186)">
          <rect width="118" height="46" rx="15" fill="#fff7ed"/>
          <text x="18" y="29" fill="#c2410c" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">العربية · AR</text>
          <rect x="132" width="118" height="46" rx="15" fill="#ecfeff"/>
          <text x="150" y="29" fill="#0f766e" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">Türkçe · TR</text>
          <rect x="264" width="128" height="46" rx="15" fill="#eef2ff"/>
          <text x="282" y="29" fill="#4338ca" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="700">English · EN</text>
        </g>

        <g transform="translate(0 258)">
          <rect width="392" height="82" rx="18" fill="#f1f5f9"/>
          <text x="18" y="31" fill="#475569" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">HYBRID RETRIEVAL</text>
          <rect x="18" y="48" width="220" height="8" rx="4" fill="#cbd5e1"/>
          <rect x="18" y="48" width="190" height="8" rx="4" fill="url(#accent)"/>
          <text x="260" y="59" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="12">Dense + BM25</text>
        </g>
      </g>
    </g>
  </g>
</svg>

